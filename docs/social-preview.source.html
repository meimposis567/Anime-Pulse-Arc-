<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1280px;overflow:hidden;background:#04030c}
  .card{position:relative;width:2560px;height:1280px;overflow:hidden;
    background:
      radial-gradient(1800px 1300px at 8% -12%, #3d128a 0%, transparent 55%),
      radial-gradient(1500px 1100px at 104% 8%, #06506f 0%, transparent 54%),
      radial-gradient(1300px 1300px at 22% 120%, #5c1263 0%, transparent 56%),
      radial-gradient(1100px 900px at 88% 104%, #0d2f68 0%, transparent 55%),
      linear-gradient(165deg, #0b0722 0%, #05030f 100%);}

  /* aurora blobs */
  .orb{position:absolute;border-radius:50%;filter:blur(150px)}
  .o1{width:1200px;height:1200px;left:-280px;top:-340px;background:radial-gradient(circle,rgba(168,85,247,.95),transparent 68%)}
  .o2{width:1050px;height:1050px;right:-220px;top:60px;background:radial-gradient(circle,rgba(34,211,238,.8),transparent 68%)}
  .o3{width:1000px;height:1000px;left:640px;bottom:-420px;background:radial-gradient(circle,rgba(255,61,143,.72),transparent 68%)}
  .o4{width:700px;height:700px;right:420px;bottom:-260px;background:radial-gradient(circle,rgba(251,191,36,.36),transparent 68%)}

  /* speed lines from centre */
  .rays{position:absolute;inset:-30%;
    background:repeating-conic-gradient(from 0deg at 50% 46%,
      rgba(255,255,255,.075) 0deg .45deg, transparent .45deg 3.1deg);
    -webkit-mask-image:radial-gradient(closest-side,transparent 20%,#000 62%,transparent 96%);
    mask-image:radial-gradient(closest-side,transparent 20%,#000 62%,transparent 96%)}

  /* tech grid + screentone */
  .grid{position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(90deg,rgba(168,85,247,.10) 0 2px,transparent 2px 150px),
      repeating-linear-gradient(0deg,rgba(34,211,238,.085) 0 2px,transparent 2px 150px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent)}
  .tone{position:absolute;inset:0;opacity:.75;
    background-image:radial-gradient(rgba(255,255,255,.075) 1.6px,transparent 2.2px);
    background-size:12px 12px;
    -webkit-mask-image:radial-gradient(72% 62% at 50% 45%,#000 18%,transparent 78%);
    mask-image:radial-gradient(72% 62% at 50% 45%,#000 18%,transparent 78%)}

  /* petals */
  .petal{position:absolute;border-radius:22px 0 22px 0;opacity:.55}

  .vig{position:absolute;inset:0;
    background:radial-gradient(120% 92% at 50% 46%,transparent 38%,rgba(3,2,9,.72) 100%)}

  /* anime corner brackets */
  .br{position:absolute;width:132px;height:132px;color:rgba(95,240,255,.85);
    filter:drop-shadow(0 0 14px rgba(34,211,238,.7))}
  .tl{top:64px;left:64px;border-top:5px solid;border-left:5px solid;border-top-left-radius:22px}
  .tr{top:64px;right:64px;border-top:5px solid;border-right:5px solid;border-top-right-radius:22px}
  .bl{bottom:64px;left:64px;border-bottom:5px solid;border-left:5px solid;border-bottom-left-radius:22px}
  .brr{bottom:64px;right:64px;border-bottom:5px solid;border-right:5px solid;border-bottom-right-radius:22px}

  .stage{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:0}

  .logoWrap{position:relative;display:grid;place-items:center;margin-bottom:34px}
  .halo{position:absolute;width:376px;height:376px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.42),rgba(168,85,247,.22) 48%,transparent 70%);
    filter:blur(30px)}
  .ring{position:absolute;width:292px;height:270px;border-radius:50%;
    border:3px solid rgba(95,240,255,.32)}
  .ring2{position:absolute;width:344px;height:318px;border-radius:50%;
    border:2px dashed rgba(255,111,174,.28)}
  .logo{position:relative;width:216px;height:216px;object-fit:contain;
    filter:drop-shadow(0 0 40px rgba(34,211,238,.85)) drop-shadow(0 0 96px rgba(168,85,247,.6))}

  .name{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:158px;
    line-height:.95;letter-spacing:.02em;white-space:nowrap;
    background:linear-gradient(100deg,#8ff6ff 0%,#5ff0ff 18%,#c084fc 50%,#ff6fae 82%,#ff9ec7 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 60px rgba(34,211,238,.32))}

  .kana{font-family:'Chakra Petch',sans-serif;font-size:31px;letter-spacing:.62em;
    color:rgba(206,224,255,.66);margin-top:26px;text-indent:.62em}

  .rule{margin-top:40px;width:520px;height:3px;border-radius:99px;
    background:linear-gradient(90deg,transparent,#5ff0ff 22%,#a855f7 52%,#ff6fae 78%,transparent)}

  .tag{font-family:'Zen Maru Gothic',sans-serif;font-size:41px;color:rgba(232,238,248,.94);
    margin-top:40px;letter-spacing:.005em}

  .pills{display:flex;gap:20px;margin-top:44px}
  .pill{font-family:'Chakra Petch',sans-serif;font-size:23px;font-weight:600;
    letter-spacing:.2em;padding:13px 30px;border-radius:99px;
    border:2px solid rgba(168,85,247,.5);color:#e9d5ff;
    background:linear-gradient(100deg,rgba(168,85,247,.24),rgba(34,211,238,.2))}
</style></head>
<body>
<div class="card">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="orb o3"></div><div class="orb o4"></div>
  <div class="rays"></div><div class="grid"></div><div class="tone"></div>

  <div class="petal" style="left:238px;top:300px;width:34px;height:34px;background:linear-gradient(135deg,#ff6fae,transparent);transform:rotate(24deg)"></div>
  <div class="petal" style="left:410px;top:840px;width:26px;height:26px;background:linear-gradient(135deg,#5ff0ff,transparent);transform:rotate(-38deg)"></div>
  <div class="petal" style="right:330px;top:250px;width:30px;height:30px;background:linear-gradient(135deg,#c084fc,transparent);transform:rotate(52deg)"></div>
  <div class="petal" style="right:520px;bottom:270px;width:36px;height:36px;background:linear-gradient(135deg,#ff9ec7,transparent);transform:rotate(-16deg)"></div>
  <div class="petal" style="left:1180px;top:170px;width:22px;height:22px;background:linear-gradient(135deg,#5ff0ff,transparent);transform:rotate(70deg)"></div>
  <div class="petal" style="right:180px;bottom:560px;width:28px;height:28px;background:linear-gradient(135deg,#ff6fae,transparent);transform:rotate(12deg)"></div>

  <div class="vig"></div>
  <div class="br tl"></div><div class="br tr"></div>
  <div class="br bl"></div><div class="br brr"></div>

  <div class="stage">
    <div class="logoWrap">
      <div class="halo"></div><div class="ring2"></div><div class="ring"></div>
      <img class="logo" src="../frontend/src/assets/logo.png" alt="">
    </div>
    <div class="name">ANIME PULSE ARC</div>
    <div class="kana">アニメ・パルス・アーク</div>
    <div class="rule"></div>
    <div class="tag">Discover your next arc.</div>
    <div class="pills">
      <div class="pill">MERN STACK</div>
      <div class="pill">ANILIST API</div>
      <div class="pill">REACT + VITE</div>
    </div>
  </div>
</div>
</body></html>
